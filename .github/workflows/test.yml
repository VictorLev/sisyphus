name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Only the backend has dependencies; the frontend is plain ES modules
      # with no build step, and the tests use Node's built-in runner.
      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Run tests
        run: npm test

  # Builds the Docker image and publishes it to GitHub's container registry.
  # Only for pushes to main, and only once the tests pass. The home server
  # pulls it from there (deploy/update.sh); nothing ever connects to it.
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/victorlev/sisyphus:latest
            ghcr.io/victorlev/sisyphus:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
