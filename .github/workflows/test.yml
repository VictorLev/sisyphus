name: ci

# Release flow:
#   pull request / any push  -> tests + build the image and smoke-test it
#   push to main             -> publish :latest and :<sha>  (nothing deploys it)
#   push a tag v1.2.3        -> promote that commit's image to :stable and :v1.2.3
#                               (prod follows :stable)
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

env:
  REGISTRY_IMAGE: ghcr.io/victorlev/sisyphus

jobs:
  # Branch names say what kind of change they carry, and so which part of
  # the version the next release bumps (README.md -> Branches and releases).
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch name
        env:
          # Through env, never inlined: a branch name is user input.
          BRANCH: ${{ github.head_ref }}
        run: |
          if printf '%s' "$BRANCH" | grep -Eq '^(feat|fix|breaking|chore|docs|ci)/[a-z0-9]+(-[a-z0-9]+)*$'; then
            echo "Branch name '$BRANCH' follows the convention."
          else
            echo "::error title=Branch name::'$BRANCH' should be <type>/<short-kebab-name>, type one of feat, fix, breaking, chore, docs, ci (e.g. feat/leaderboard). Rename with: git branch -m <new-name>, push it, and reopen the PR."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Only the backend has dependencies; the frontend is plain ES modules
      # with no build step, and the tests use Node's built-in runner.
      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Run tests
        run: npm test

  # Builds the image exactly as it will be published and runs it: upgrade
  # from a pre-accounts database, login, admin CLI, backup, restart. Nothing
  # is pushed, so this is safe on pull requests from forks too.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sisyphus:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: scripts/smoke-image.sh sisyphus:ci

  # Publishes to GitHub's container registry, only from main and only once
  # both the tests and the image smoke test pass. The homelab pulls from
  # there; nothing ever connects to it.
  publish:
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the smoke-tested build, so the layers come from cache.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:latest
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A release does not rebuild: it re-tags the image main already published
  # (and CI already smoke-tested) for that commit. Tag only commits that have
  # been on main; otherwise there is no image to promote and this fails.
  # A tag pushed right after merging races main's publish job, so the image
  # is waited for (up to 15 minutes) rather than expected to be there.
  release:
    needs: [test, image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for main's image of this commit
        run: |
          for i in $(seq 1 90); do
            if docker buildx imagetools inspect "$REGISTRY_IMAGE:${{ github.sha }}" > /dev/null 2>&1; then
              echo "Found $REGISTRY_IMAGE:${{ github.sha }}"
              exit 0
            fi
            echo "Not published yet ($i/90); main's publish job may still be running. Waiting 10 s."
            sleep 10
          done
          echo "::error::No image for ${{ github.sha }} after 15 minutes. Was this commit merged to main, and did main's publish job succeed?"
          exit 1

      - name: Promote ${{ github.ref_name }} to stable
        run: |
          docker buildx imagetools create \
            --tag "$REGISTRY_IMAGE:stable" \
            --tag "$REGISTRY_IMAGE:${{ github.ref_name }}" \
            "$REGISTRY_IMAGE:${{ github.sha }}"
