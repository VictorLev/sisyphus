# Runs Sisyphus on a home server behind HTTPS.
#
# HTTPS is not optional: Web Bluetooth only works on localhost or a secure
# origin, so without it Chrome on another machine cannot reach the trainer.
# Caddy issues a certificate from its own local authority (see README.md in
# this folder for the one-time step of trusting it on the riding PC).

services:
  app:
    image: ghcr.io/victorlev/sisyphus:latest
    restart: unless-stopped
    volumes:
      - sisyphus-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sisyphus-data:
  caddy-data:
  caddy-config:
